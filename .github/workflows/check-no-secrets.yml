name: Block secrets in git
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if phrase or secrets file is tracked
        run: |
          set -e
          bad=$(git ls-files | grep -E '^(phrase\.txt|\.env)$' || true)
          if [ -n "$bad" ]; then
            echo "Do not commit phrase.txt or .env — they may contain your seed."
            echo "$bad"
            exit 1
          fi
          echo "OK: no phrase.txt or .env in git index"
