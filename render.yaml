# Render Blueprint — set secrets in the Render dashboard (never in this file).
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: still-zen-ark
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ARKADE_MNEMONIC
        sync: false
      - key: FAUCET_PUBLIC_URL
        sync: false
      # Drip sats: edit drip_config.mjs (not an env var)
      # Stricter than local defaults — tune in dashboard if needed
      - key: FAUCET_GLOBAL_PER_MINUTE
        value: "20"
      - key: FAUCET_CLAIM_BURST
        value: "4 per minute"
      - key: FAUCET_CLAIM_PER_HOUR
        value: "8 per hour"
      - key: FAUCET_CLAIM_MIN_SECONDS
        value: "4"
      - key: FAUCET_CLAIM_FAIL_WINDOW_MIN
        value: "10"
      - key: FAUCET_CLAIM_FAIL_THRESHOLD
        value: "6"
      - key: FAUCET_CLAIM_FAIL_BLOCK_SEC
        value: "600"
